<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg-shinobi" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="rgb(46,9,17)"/>
      <stop offset="60%" stop-color="rgb(22,9,15)"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <!-- Ambient glow behind head -->
    <radialGradient id="ambi-shinobi" cx="50%" cy="44%" r="38%">
      <stop offset="0%" stop-color="#c82030" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c82030" stop-opacity="0"/>
    </radialGradient>
    <!-- Skin gradient: key light upper-left, shadow lower-right -->
    <linearGradient id="skin-shinobi" x1="20%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#5a3920"/>
      <stop offset="45%" stop-color="#7a5940"/>
      <stop offset="100%" stop-color="rgb(83,61,44)"/>
    </linearGradient>
    <!-- Hair gradient -->
    <linearGradient id="hair-shinobi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(54,52,52)"/>
      <stop offset="100%" stop-color="rgb(8,6,6)"/>
    </linearGradient>
    <!-- Rim light -->
    <radialGradient id="rim-shinobi" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#c82030" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#c82030" stop-opacity="0"/>
    </radialGradient>
    <!-- Eye glow -->
    <radialGradient id="eye-shinobi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgb(228,144,152)"/>
      <stop offset="60%" stop-color="#c82030"/>
      <stop offset="100%" stop-color="rgb(140,22,34)"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow-shinobi" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-shinobi" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="rim-blur-shinobi" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <!-- Subtle noise texture -->
    <filter id="noise-shinobi">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Layer 1: Background -->
  <rect width="256" height="256" fill="url(#bg-shinobi)"/>

  <!-- Layer 2: Noise texture overlay -->
  <rect width="256" height="256" fill="rgb(17,9,15)" filter="url(#noise-shinobi)" opacity="0.12"/>

  <!-- Layer 3: Ambient head glow -->
  <ellipse cx="128" cy="112" rx="72" ry="68" fill="url(#ambi-shinobi)"/>

  <!-- Layer 4: Shoulders/torso -->
  <path d="M68,256 C68,210 82,195 98,188 L128,182 L158,188 C174,195 188,210 188,256 Z" fill="rgb(67,49,35)"/>
  <path d="M68,256 C68,210 82,195 98,188 L128,182 L158,188 C174,195 188,210 188,256 Z" fill="rgb(20,9,15)" opacity="0.4"/>

  <!-- Layer 5: Neck -->
  <ellipse cx="128" cy="175" rx="18" ry="12" fill="url(#skin-shinobi)"/>
  <rect x="112" y="168" width="32" height="22" rx="8" fill="url(#skin-shinobi)"/>

  <!-- Layer 6: Hair back/sides -->
  <ellipse cx="128" cy="102" rx="45" ry="48" fill="url(#hair-shinobi)"/>

  <!-- Layer 7: Face/head -->
  <ellipse cx="128" cy="108" rx="35" ry="40" fill="url(#skin-shinobi)"/>
  <path d="M100,142 Q98,162 128,166 Q158,162 156,142" fill="url(#skin-shinobi)"/>

  <!-- Layer 8: Brow ridge -->
  <ellipse cx="128" cy="94" rx="26" ry="5" fill="rgb(100,73,52)" opacity="0.5"/>

  <!-- Layer 9: Eyes -->
  <ellipse cx="112" cy="108" rx="7" ry="5" fill="#0a0c10"/>
  <ellipse cx="144" cy="108" rx="7" ry="5" fill="#0a0c10"/>
  <ellipse cx="112" cy="108" rx="4.5" ry="3.5" fill="url(#eye-shinobi)" filter="url(#glow-shinobi)"/>
  <ellipse cx="144" cy="108" rx="4.5" ry="3.5" fill="url(#eye-shinobi)" filter="url(#glow-shinobi)"/>
  <!-- Eye shine -->
  <ellipse cx="114" cy="106" rx="1.5" ry="1" fill="white" opacity="0.7"/>
  <ellipse cx="146" cy="106" rx="1.5" ry="1" fill="white" opacity="0.7"/>

  <!-- Layer 10: Nose (subtle) -->
  <path d="M124,118 Q128,126 132,118" stroke="rgb(92,67,48)" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- Layer 11: Lips -->
  <path d="M120,133 Q128,139 136,133" stroke="rgb(85,62,45)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Layer 12: Hair front/fringe -->
  <path d="M91,102 Q99,64 128,62 Q157,64 165,102" fill="url(#hair-shinobi)"/>

  <!-- Layer 13: Rim light (right edge of head) -->
  <ellipse cx="162" cy="108" rx="22" ry="38" fill="url(#rim-shinobi)" opacity="0.65"/>

  <!-- Layer 14: Key light (upper-left face) -->
  <ellipse cx="104" cy="88" rx="24" ry="20" fill="#5a3920" opacity="0.18"/>

  <!-- Layer 15: Accessory / motif -->
  <g transform="translate(152,64)" opacity="0.8">
    <path d="M10,0 L14,60 L10,70 L6,60 Z" fill="#c82030" opacity="0.7"/>
    <path d="M10,0 L14,60 L10,70 L6,60 Z" fill="none" stroke="rgb(222,121,131)" stroke-width="0.8"/>
    <line x1="2" y1="58" x2="18" y2="58" stroke="#c82030" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="6" y="68" width="8" height="16" rx="3" fill="#2a2010"/>
  </g>

  <!-- Layer 16: Particles -->
  <circle cx="58" cy="68" r="2" fill="#c82030" opacity="0.35"/>
  <circle cx="192" cy="80" r="1.5" fill="#c82030" opacity="0.25"/>
  <circle cx="42" cy="140" r="1.2" fill="#c82030" opacity="0.2"/>
  <circle cx="208" cy="52" r="1.8" fill="#c82030" opacity="0.3"/>
  <circle cx="76" cy="192" r="1.4" fill="#c82030" opacity="0.18"/>
  <circle cx="184" cy="168" r="1.6" fill="#c82030" opacity="0.22"/>
</svg>