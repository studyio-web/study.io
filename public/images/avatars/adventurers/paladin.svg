<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg-paladin" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="rgb(46,52,70)"/>
      <stop offset="60%" stop-color="rgb(22,26,36)"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <!-- Ambient glow behind head -->
    <radialGradient id="ambi-paladin" cx="50%" cy="44%" r="38%">
      <stop offset="0%" stop-color="#e0e8f8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e0e8f8" stop-opacity="0"/>
    </radialGradient>
    <!-- Skin gradient: key light upper-left, shadow lower-right -->
    <linearGradient id="skin-paladin" x1="20%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#e8b898"/>
      <stop offset="45%" stop-color="#f8d5be"/>
      <stop offset="100%" stop-color="rgb(169,145,129)"/>
    </linearGradient>
    <!-- Hair gradient -->
    <linearGradient id="hair-paladin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(210,210,230)"/>
      <stop offset="100%" stop-color="rgb(160,160,179)"/>
    </linearGradient>
    <!-- Rim light -->
    <radialGradient id="rim-paladin" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#e0e8f8" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#e0e8f8" stop-opacity="0"/>
    </radialGradient>
    <!-- Eye glow -->
    <radialGradient id="eye-paladin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgb(232,240,252)"/>
      <stop offset="60%" stop-color="#d0e0f8"/>
      <stop offset="100%" stop-color="rgb(146,157,174)"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow-paladin" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-paladin" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="rim-blur-paladin" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <!-- Subtle noise texture -->
    <filter id="noise-paladin">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Layer 1: Background -->
  <rect width="256" height="256" fill="url(#bg-paladin)"/>

  <!-- Layer 2: Noise texture overlay -->
  <rect width="256" height="256" fill="rgb(17,20,29)" filter="url(#noise-paladin)" opacity="0.12"/>

  <!-- Layer 3: Ambient head glow -->
  <ellipse cx="128" cy="112" rx="72" ry="68" fill="url(#ambi-paladin)"/>

  <!-- Layer 4: Shoulders/torso -->
  <path d="M68,256 C68,210 82,195 98,188 L128,182 L158,188 C174,195 188,210 188,256 Z" fill="rgb(136,117,105)"/>
  <path d="M68,256 C68,210 82,195 98,188 L128,182 L158,188 C174,195 188,210 188,256 Z" fill="rgb(20,23,33)" opacity="0.4"/>

  <!-- Layer 5: Neck -->
  <ellipse cx="128" cy="175" rx="18" ry="12" fill="url(#skin-paladin)"/>
  <rect x="112" y="168" width="32" height="22" rx="8" fill="url(#skin-paladin)"/>

  <!-- Layer 6: Hair back/sides -->
  <ellipse cx="128" cy="102" rx="46" ry="48" fill="url(#hair-paladin)"/>

  <!-- Layer 7: Face/head -->
  <ellipse cx="128" cy="108" rx="36" ry="40" fill="url(#skin-paladin)"/>
  <path d="M94,144 L94,162 Q128,170 162,162 L162,144" fill="url(#skin-paladin)"/>

  <!-- Layer 8: Brow ridge -->
  <ellipse cx="128" cy="92" rx="28" ry="6" fill="rgb(203,175,156)" opacity="0.5"/>

  <!-- Layer 9: Eyes -->
  <ellipse cx="112" cy="108" rx="7" ry="5" fill="#0a0c10"/>
  <ellipse cx="144" cy="108" rx="7" ry="5" fill="#0a0c10"/>
  <ellipse cx="112" cy="108" rx="4.5" ry="3.5" fill="url(#eye-paladin)" filter="url(#glow-paladin)"/>
  <ellipse cx="144" cy="108" rx="4.5" ry="3.5" fill="url(#eye-paladin)" filter="url(#glow-paladin)"/>
  <!-- Eye shine -->
  <ellipse cx="114" cy="106" rx="1.5" ry="1" fill="white" opacity="0.7"/>
  <ellipse cx="146" cy="106" rx="1.5" ry="1" fill="white" opacity="0.7"/>

  <!-- Layer 10: Nose (subtle) -->
  <path d="M124,118 Q128,126 132,118" stroke="rgb(186,160,143)" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- Layer 11: Lips -->
  <path d="M120,133 Q128,139 136,133" stroke="rgb(174,149,133)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Layer 12: Hair front/fringe -->
  <path d="M90,102 Q98,64 128,62 Q158,64 166,102" fill="url(#hair-paladin)"/>

  <!-- Layer 13: Rim light (right edge of head) -->
  <ellipse cx="162" cy="108" rx="22" ry="38" fill="url(#rim-paladin)" opacity="0.65"/>

  <!-- Layer 14: Key light (upper-left face) -->
  <ellipse cx="104" cy="88" rx="24" ry="20" fill="#e8b898" opacity="0.18"/>

  <!-- Layer 15: Accessory / motif -->
  <g transform="translate(96,66)" opacity="0.85">
    <polygon points="32,20 10,0 0,16 10,10 20,0 32,16 44,0 54,10 64,16 54,0" fill="none" stroke="#e0e8f8" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="32,20 10,0 0,16 10,10 20,0 32,16 44,0 54,10 64,16 54,0" fill="#e0e8f8" opacity="0.2"/>
    <circle cx="20" cy="2" r="3" fill="#e0e8f8" opacity="0.9"/>
    <circle cx="32" cy="0" r="3.5" fill="#e0e8f8" opacity="0.9"/>
    <circle cx="44" cy="2" r="3" fill="#e0e8f8" opacity="0.9"/>
  </g><g transform="translate(152,60)" opacity="0.8">
    <line x1="10" y1="0" x2="10" y2="90" stroke="#e0e8f8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="0" x2="10" y2="90" stroke="rgb(236,241,251)" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="70" x2="20" y2="70" stroke="#e0e8f8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="10,0 7,8 13,8" fill="rgb(240,244,252)"/>
  </g>

  <!-- Layer 16: Particles -->
  <circle cx="58" cy="68" r="2" fill="#e0e8f8" opacity="0.35"/>
  <circle cx="192" cy="80" r="1.5" fill="#e0e8f8" opacity="0.25"/>
  <circle cx="42" cy="140" r="1.2" fill="#e0e8f8" opacity="0.2"/>
  <circle cx="208" cy="52" r="1.8" fill="#e0e8f8" opacity="0.3"/>
  <circle cx="76" cy="192" r="1.4" fill="#e0e8f8" opacity="0.18"/>
  <circle cx="184" cy="168" r="1.6" fill="#e0e8f8" opacity="0.22"/>
</svg>