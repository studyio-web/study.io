<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-quantum-core" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="rgb(5,31,46)"/>
      <stop offset="65%" stop-color="rgb(6,17,25)"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <radialGradient id="ambi-quantum-core" cx="50%" cy="44%" r="40%">
      <stop offset="0%" stop-color="#00e8ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head-quantum-core" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="50%" stop-color="#181e28"/>
      <stop offset="100%" stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="visor-quantum-core" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgb(0,162,179)"/>
      <stop offset="30%" stop-color="#00e8ff"/>
      <stop offset="70%" stop-color="#80f8ff"/>
      <stop offset="100%" stop-color="rgb(0,186,204)"/>
    </linearGradient>
    <linearGradient id="shoulder-quantum-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222633"/>
      <stop offset="100%" stop-color="#0e1118"/>
    </linearGradient>
    <radialGradient id="rim-quantum-core" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00e8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00e8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-quantum-core" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-quantum-core" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="noise-quantum-core">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg-quantum-core)"/>
  <rect width="256" height="256" fill="rgb(7,14,21)" filter="url(#noise-quantum-core)" opacity="0.1"/>

  <!-- Ambient glow -->
  <ellipse cx="128" cy="110" rx="70" ry="65" fill="url(#ambi-quantum-core)"/>

  <!-- Shoulders -->
  <path d="M62,256 L62,205 Q62,195 72,192 L110,186 L128,184 L146,186 L184,192 Q194,195 194,205 L194,256 Z" fill="url(#shoulder-quantum-core)"/>
  <!-- Shoulder highlight -->
  <path d="M62,210 Q80,200 128,197 Q176,200 194,210" stroke="rgb(38,235,255)" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Neck -->
  <rect x="114" y="172" width="28" height="20" rx="5" fill="#1a1f28"/>
  <rect x="118" y="174" width="8" height="16" rx="3" fill="rgb(4,98,110)" opacity="0.5"/>
  <rect x="130" y="174" width="8" height="16" rx="3" fill="rgb(4,98,110)" opacity="0.5"/>

  <!-- Head body -->
  <rect x="82" y="72" width="92" height="104" rx="16" fill="url(#head-quantum-core)"/>
  <!-- Head rim light -->
  <rect x="82" y="72" width="92" height="104" rx="16" fill="url(#rim-quantum-core)" opacity="0.5"/>

  <!-- Panel lines on face -->
  <line x1="128" y1="78" x2="128" y2="168" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <line x1="88" y1="120" x2="168" y2="120" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <!-- Faceplate inset -->
  <rect x="90" y="80" width="76" height="88" rx="10" fill="#141820" opacity="0.6"/>

  <!-- Antenna -->
  <rect x="125" y="58" width="6" height="18" rx="3" fill="#1e242e"/>
  <circle cx="128" cy="55" r="6" fill="#00e8ff" filter="url(#glow-quantum-core)" opacity="0.9"/>
  <circle cx="128" cy="55" r="3" fill="rgb(128,244,255)"/>

  <!-- Visor / eye bar -->
  <rect x="92" y="102" width="72" height="22" rx="8" fill="url(#visor-quantum-core)" filter="url(#glow-quantum-core)"/>
  <!-- Visor sheen -->
  <rect x="92" y="102" width="72" height="10" rx="8" fill="white" opacity="0.08"/>
  <!-- Visor scan line -->
  <rect x="92" y="112" width="72" height="1.5" fill="#00e8ff" opacity="0.5"/>

  <!-- Side sensors -->
  <circle cx="85" cy="100" r="5" fill="#00e8ff" opacity="0.7" filter="url(#soft-quantum-core)"/>
  <circle cx="171" cy="100" r="5" fill="#00e8ff" opacity="0.7" filter="url(#soft-quantum-core)"/>
  <circle cx="85" cy="100" r="2.5" fill="rgb(128,244,255)"/>
  <circle cx="171" cy="100" r="2.5" fill="rgb(128,244,255)"/>

  <!-- Chin LED row -->
  <circle cx="112" cy="150" r="3" fill="#00e8ff" opacity="0.8" filter="url(#soft-quantum-core)"/>
  <circle cx="128" cy="150" r="3" fill="#00e8ff" opacity="0.8" filter="url(#soft-quantum-core)"/>
  <circle cx="144" cy="150" r="3" fill="#00e8ff" opacity="0.8" filter="url(#soft-quantum-core)"/>

  <!-- Particles -->
  <circle cx="54" cy="72" r="2" fill="#00e8ff" opacity="0.3"/>
  <circle cx="196" cy="82" r="1.5" fill="#00e8ff" opacity="0.25"/>
  <circle cx="46" cy="148" r="1.4" fill="#00e8ff" opacity="0.2"/>
  <circle cx="208" cy="58" r="1.8" fill="#00e8ff" opacity="0.28"/>
  <circle cx="74" cy="196" r="1.3" fill="#00e8ff" opacity="0.18"/>
  <circle cx="186" cy="172" r="1.5" fill="#00e8ff" opacity="0.22"/>
</svg>