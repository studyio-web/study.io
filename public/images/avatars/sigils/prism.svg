<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-prism" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgb(7,35,48)"/>
      <stop offset="65%" stop-color="rgb(7,19,28)"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <radialGradient id="ambi-prism" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#60d0f0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#60d0f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shape-prism" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="rgb(144,222,245)"/>
      <stop offset="50%" stop-color="#60d0f0"/>
      <stop offset="100%" stop-color="rgb(173,216,230)"/>
    </linearGradient>
    <radialGradient id="inner-prism" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgb(191,236,249)" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#60d0f0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60d0f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-prism" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur-prism" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="noise-prism">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg-prism)"/>
  <rect width="256" height="256" fill="rgb(7,15,22)" filter="url(#noise-prism)" opacity="0.12"/>

  <!-- Ambient glow -->
  <ellipse cx="128" cy="128" rx="78" ry="78" fill="url(#ambi-prism)"/>

  
  <!-- Moon crescent -->
  <circle cx="128" cy="128" r="68" fill="#60d0f0" opacity="0.07" filter="url(#blur-prism)"/>
  <circle cx="128" cy="128" r="62" fill="none" stroke="#60d0f0" stroke-width="2" opacity="0.3"/>
  <!-- Crescent shape via two circles -->
  <circle cx="128" cy="128" r="52" fill="url(#shape-prism)" opacity="0.9" filter="url(#glow-prism)"/>
  <circle cx="148" cy="118" r="42" fill="rgb(11,19,25)"/>
  <circle cx="148" cy="118" r="42" fill="#07090e" opacity="0.92"/>
  <!-- Crescent outline -->
  <circle cx="128" cy="128" r="52" fill="none" stroke="rgb(144,222,245)" stroke-width="1.5" opacity="0.6"/>
  <!-- Stars near crescent -->
  <circle cx="162" cy="82" r="4" fill="#c0f0ff" filter="url(#glow-prism)" opacity="0.9"/>
  <circle cx="176" cy="102" r="2.5" fill="#c0f0ff" filter="url(#glow-prism)" opacity="0.7"/>
  <circle cx="170" cy="68" r="2" fill="rgb(217,246,255)" opacity="0.6"/>
  <!-- Inner glow core -->
  <circle cx="110" cy="128" r="20" fill="url(#inner-prism)" opacity="0.5"/>

  <!-- Particles -->
  <circle cx="58" cy="62" r="2.5" fill="#60d0f0" opacity="0.4"/>
  <circle cx="192" cy="72" r="2" fill="#c0f0ff" opacity="0.35"/>
  <circle cx="44" cy="150" r="1.8" fill="#60d0f0" opacity="0.3"/>
  <circle cx="210" cy="58" r="2.2" fill="#c0f0ff" opacity="0.32"/>
  <circle cx="72" cy="196" r="1.6" fill="#60d0f0" opacity="0.28"/>
  <circle cx="186" cy="180" r="2" fill="#c0f0ff" opacity="0.25"/>
  <circle cx="40" cy="90" r="1.4" fill="#60d0f0" opacity="0.2"/>
  <circle cx="216" cy="170" r="1.5" fill="#c0f0ff" opacity="0.22"/>
</svg>