<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-nexus-orbit" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgb(5,33,46)"/>
      <stop offset="65%" stop-color="rgb(6,18,27)"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <radialGradient id="ambi-nexus-orbit" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#20d0e8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#20d0e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shape-nexus-orbit" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="rgb(99,222,239)"/>
      <stop offset="50%" stop-color="#20d0e8"/>
      <stop offset="100%" stop-color="rgb(115,223,230)"/>
    </linearGradient>
    <radialGradient id="inner-nexus-orbit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgb(166,236,246)" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#20d0e8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#20d0e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-nexus-orbit" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur-nexus-orbit" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="noise-nexus-orbit">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg-nexus-orbit)"/>
  <rect width="256" height="256" fill="rgb(7,15,21)" filter="url(#noise-nexus-orbit)" opacity="0.12"/>

  <!-- Ambient glow -->
  <ellipse cx="128" cy="128" rx="78" ry="78" fill="url(#ambi-nexus-orbit)"/>

  
  <!-- Outer glow hex -->
  <polygon points="193.82,90.00 193.82,166.00 128.00,204.00 62.18,166.00 62.18,90.00 128.00,52.00" fill="#20d0e8" opacity="0.07" filter="url(#blur-nexus-orbit)"/>
  <polygon points="188.62,93.00 188.62,163.00 128.00,198.00 67.38,163.00 67.38,93.00 128.00,58.00" fill="none" stroke="#20d0e8" stroke-width="2" opacity="0.3"/>
  <polygon points="178.23,99.00 178.23,157.00 128.00,186.00 77.77,157.00 77.77,99.00 128.00,70.00" fill="none" stroke="#80f8ff" stroke-width="2" opacity="0.5"/>
  <!-- Main hex -->
  <polygon points="167.84,105.00 167.84,151.00 128.00,174.00 88.16,151.00 88.16,105.00 128.00,82.00" fill="url(#shape-nexus-orbit)" filter="url(#glow-nexus-orbit)" opacity="0.9"/>
  <polygon points="167.84,105.00 167.84,151.00 128.00,174.00 88.16,151.00 88.16,105.00 128.00,82.00" fill="url(#inner-nexus-orbit)"/>
  <!-- Orbit ring -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#20d0e8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
  <!-- Orbit dots -->
  <circle cx="128" cy="40" r="5" fill="#80f8ff" filter="url(#glow-nexus-orbit)" opacity="0.9"/>
  <circle cx="204" cy="84" r="4" fill="#80f8ff" filter="url(#glow-nexus-orbit)" opacity="0.75"/>
  <circle cx="204" cy="172" r="3.5" fill="#80f8ff" opacity="0.6"/>
  <circle cx="128" cy="216" r="5" fill="#80f8ff" filter="url(#glow-nexus-orbit)" opacity="0.9"/>
  <circle cx="52" cy="172" r="4" fill="#80f8ff" opacity="0.6"/>
  <circle cx="52" cy="84" r="3.5" fill="#80f8ff" filter="url(#glow-nexus-orbit)" opacity="0.75"/>
  <!-- Center -->
  <circle cx="128" cy="128" r="10" fill="rgb(144,232,244)" filter="url(#glow-nexus-orbit)"/>
  <circle cx="128" cy="128" r="4" fill="white" opacity="0.8"/>

  <!-- Particles -->
  <circle cx="58" cy="62" r="2.5" fill="#20d0e8" opacity="0.4"/>
  <circle cx="192" cy="72" r="2" fill="#80f8ff" opacity="0.35"/>
  <circle cx="44" cy="150" r="1.8" fill="#20d0e8" opacity="0.3"/>
  <circle cx="210" cy="58" r="2.2" fill="#80f8ff" opacity="0.32"/>
  <circle cx="72" cy="196" r="1.6" fill="#20d0e8" opacity="0.28"/>
  <circle cx="186" cy="180" r="2" fill="#80f8ff" opacity="0.25"/>
  <circle cx="40" cy="90" r="1.4" fill="#20d0e8" opacity="0.2"/>
  <circle cx="216" cy="170" r="1.5" fill="#80f8ff" opacity="0.22"/>
</svg>