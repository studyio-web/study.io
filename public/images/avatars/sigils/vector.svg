<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-vector" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgb(7,35,24)"/>
      <stop offset="65%" stop-color="rgb(7,19,18)"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <radialGradient id="ambi-vector" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#28c060" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#28c060" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shape-vector" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="rgb(105,211,144)"/>
      <stop offset="50%" stop-color="#28c060"/>
      <stop offset="100%" stop-color="rgb(115,216,144)"/>
    </linearGradient>
    <radialGradient id="inner-vector" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgb(169,230,191)" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#28c060" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#28c060" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-vector" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur-vector" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="noise-vector">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg-vector)"/>
  <rect width="256" height="256" fill="rgb(7,15,16)" filter="url(#noise-vector)" opacity="0.12"/>

  <!-- Ambient glow -->
  <ellipse cx="128" cy="128" rx="78" ry="78" fill="url(#ambi-vector)"/>

  
  <!-- Outer glow diamond -->
  <polygon points="128,48 192,128 128,208 64,128" fill="#28c060" opacity="0.08" filter="url(#blur-vector)"/>
  <polygon points="128,48 192,128 128,208 64,128" fill="none" stroke="#28c060" stroke-width="2.5" opacity="0.4"/>
  <polygon points="128,64 180,128 128,192 76,128" fill="none" stroke="#80f0a0" stroke-width="2" opacity="0.55"/>
  <polygon points="128,80 168,128 128,176 88,128" fill="none" stroke="#28c060" stroke-width="2" opacity="0.7"/>
  <!-- Inner filled diamond -->
  <polygon points="128,96 156,128 128,160 100,128" fill="url(#shape-vector)" filter="url(#glow-vector)"/>
  <polygon points="128,96 156,128 128,160 100,128" fill="url(#inner-vector)"/>
  <!-- Axes -->
  <line x1="128" y1="48" x2="128" y2="96" stroke="#28c060" stroke-width="1.5" opacity="0.5"/>
  <line x1="128" y1="160" x2="128" y2="208" stroke="#28c060" stroke-width="1.5" opacity="0.5"/>
  <line x1="64" y1="128" x2="100" y2="128" stroke="#28c060" stroke-width="1.5" opacity="0.5"/>
  <line x1="156" y1="128" x2="192" y2="128" stroke="#28c060" stroke-width="1.5" opacity="0.5"/>
  <circle cx="128" cy="128" r="6" fill="rgb(169,230,191)" filter="url(#glow-vector)"/>

  <!-- Particles -->
  <circle cx="58" cy="62" r="2.5" fill="#28c060" opacity="0.4"/>
  <circle cx="192" cy="72" r="2" fill="#80f0a0" opacity="0.35"/>
  <circle cx="44" cy="150" r="1.8" fill="#28c060" opacity="0.3"/>
  <circle cx="210" cy="58" r="2.2" fill="#80f0a0" opacity="0.32"/>
  <circle cx="72" cy="196" r="1.6" fill="#28c060" opacity="0.28"/>
  <circle cx="186" cy="180" r="2" fill="#80f0a0" opacity="0.25"/>
  <circle cx="40" cy="90" r="1.4" fill="#28c060" opacity="0.2"/>
  <circle cx="216" cy="170" r="1.5" fill="#80f0a0" opacity="0.22"/>
</svg>