<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-hypercube" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="rgb(5,38,36)"/>
      <stop offset="65%" stop-color="rgb(6,20,23)"/>
      <stop offset="100%" stop-color="#07090e"/>
    </radialGradient>
    <radialGradient id="ambi-hypercube" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#40e0c0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#40e0c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shape-hypercube" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="rgb(121,233,211)"/>
      <stop offset="50%" stop-color="#40e0c0"/>
      <stop offset="100%" stop-color="rgb(130,223,202)"/>
    </linearGradient>
    <radialGradient id="inner-hypercube" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgb(179,243,230)" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#40e0c0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#40e0c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-hypercube" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur-hypercube" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="noise-hypercube">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg-hypercube)"/>
  <rect width="256" height="256" fill="rgb(7,16,19)" filter="url(#noise-hypercube)" opacity="0.12"/>

  <!-- Ambient glow -->
  <ellipse cx="128" cy="128" rx="78" ry="78" fill="url(#ambi-hypercube)"/>

  
  <!-- Sine wave sigil / hypercube -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#40e0c0" stroke-width="2" opacity="0.18" filter="url(#blur-hypercube)"/>
  <circle cx="128" cy="128" r="68" fill="none" stroke="#40e0c0" stroke-width="1.5" opacity="0.28"/>
  <!-- Wave path -->
  <path d="M46,128 C60,88 76,88 90,128 C104,168 120,168 134,128 C148,88 164,88 178,128 C192,168 208,168 210,128"
    fill="none" stroke="#40e0c0" stroke-width="3.5" stroke-linecap="round" filter="url(#glow-hypercube)" opacity="0.9"/>
  <path d="M46,128 C60,88 76,88 90,128 C104,168 120,168 134,128 C148,88 164,88 178,128 C192,168 208,168 210,128"
    fill="none" stroke="rgb(160,240,224)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Second wave, offset -->
  <path d="M46,118 C60,78 76,78 90,118 C104,158 120,158 134,118 C148,78 164,78 178,118 C192,158 208,158 210,118"
    fill="none" stroke="#90f8e0" stroke-width="1.5" stroke-linecap="round" opacity="0.4" stroke-dasharray="4 5"/>
  <path d="M46,138 C60,98 76,98 90,138 C104,178 120,178 134,138 C148,98 164,98 178,138 C192,178 208,178 210,138"
    fill="none" stroke="#90f8e0" stroke-width="1.5" stroke-linecap="round" opacity="0.4" stroke-dasharray="4 5"/>
  <!-- Center node -->
  <circle cx="128" cy="128" r="10" fill="url(#inner-hypercube)" filter="url(#glow-hypercube)"/>
  <circle cx="128" cy="128" r="4" fill="white" opacity="0.8"/>

  <!-- Particles -->
  <circle cx="58" cy="62" r="2.5" fill="#40e0c0" opacity="0.4"/>
  <circle cx="192" cy="72" r="2" fill="#90f8e0" opacity="0.35"/>
  <circle cx="44" cy="150" r="1.8" fill="#40e0c0" opacity="0.3"/>
  <circle cx="210" cy="58" r="2.2" fill="#90f8e0" opacity="0.32"/>
  <circle cx="72" cy="196" r="1.6" fill="#40e0c0" opacity="0.28"/>
  <circle cx="186" cy="180" r="2" fill="#90f8e0" opacity="0.25"/>
  <circle cx="40" cy="90" r="1.4" fill="#40e0c0" opacity="0.2"/>
  <circle cx="216" cy="170" r="1.5" fill="#90f8e0" opacity="0.22"/>
</svg>